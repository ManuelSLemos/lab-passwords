[global]
   workgroup = LAB
   server string = target-samba
   security = user
   map to guest = never
   ntlm auth = ntlmv1-permitted
   server min protocol = NT1
   log level = 1

[shared]
   path = /srv/samba/shared
   browsable = yes
   writable = yes
   guest ok = no
   valid users = administrator
